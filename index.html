<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер коробок (iPhone Pro Fix)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-indigo-600 text-white shadow-md p-4 text-center">
        <h1 class="text-2xl font-bold">📦 Сканер коробок</h1>
        <p class="text-sm text-indigo-200 mt-1">ШК1 → Назва/Модель · ШК2 → Серійний номер</p>
    </header>

    <main class="flex-grow container mx-auto p-4 max-w-xl space-y-5">

        <div class="bg-white rounded-xl shadow-md p-5 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <span id="step-indicator" class="font-semibold text-indigo-600 text-base">Крок 1 з 2: Назва / Модель</span>
                <span id="badge-shk1" class="text-xs bg-indigo-100 text-indigo-800 px-2.5 py-1 rounded-full font-medium">Очікування ШК1</span>
            </div>

            <!-- Вибір камери (з'явиться автоматично після запиту дозволу) -->
            <div id="camera-select-wrapper" class="hidden space-y-1">
                <label for="camera-select" class="block text-xs font-semibold text-slate-500 uppercase">Оберіть об'єктив камери:</label>
                <select id="camera-select" onchange="switchCamera()" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </select>
            </div>

            <!-- Вікно камери -->
            <div id="reader-container" class="relative overflow-hidden rounded-lg bg-black aspect-[4/3] flex items-center justify-center">
                <div id="reader" class="w-full h-full"></div>
                <div id="camera-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 p-4 text-center bg-slate-900">
                    <svg class="w-12 h-12 mb-2 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                    <span class="text-sm">Натисніть «Увімкнути камеру»</span>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <button id="btn-start-camera" onclick="initAndStartScanner()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg transition text-sm flex items-center justify-center gap-2">
                    📷 Увімкнути камеру
                </button>
                <button id="btn-stop-camera" onclick="stopScanner()" class="bg-rose-500 hover:bg-rose-600 text-white font-medium py-2.5 px-4 rounded-lg transition text-sm hidden">
                    ⏹ Вимкнути камеру
                </button>
                <button onclick="document.getElementById('file-input').click()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium py-2.5 px-4 rounded-lg transition text-sm flex items-center justify-center gap-2">
                    🖼 З фото / галереї
                </button>
                <input type="file" id="file-input" accept="image/*" class="hidden" onchange="scanFromFile(event)">
            </div>

            <div class="pt-2 border-t space-y-2">
                <label class="block text-xs font-semibold text-slate-500 uppercase">Або ввести вручну:</label>
                <div class="flex gap-2">
                    <input type="text" id="manual-input" placeholder="Введіть значення..." class="flex-grow border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button onclick="handleManualSubmit()" class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-lg text-sm font-medium transition">ОК</button>
                </div>
            </div>

            <div id="current-buffer" class="bg-slate-50 border border-slate-200 p-3 rounded-lg text-xs space-y-1 text-slate-600">
                <div><b>ШК1 (Модель):</b> <span id="val-shk1" class="text-indigo-600 font-semibold">не зчитано</span></div>
                <div><b>ШК2 (Серійний №):</b> <span id="val-shk2" class="text-indigo-600 font-semibold">очікується...</span></div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-md p-5 space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="font-bold text-lg text-slate-700">Відскановані коробки (<span id="box-count">0</span>)</h2>
                <div class="space-x-2">
                    <button onclick="exportToCSV()" class="text-xs bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-md font-medium transition">Експорт CSV</button>
                    <button onclick="clearHistory()" class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-600 px-3 py-1.5 rounded-md font-medium transition">Очистити</button>
                </div>
            </div>

            <div id="boxes-list" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                <div id="empty-state" class="text-center text-slate-400 py-8 text-sm">Поки що порожньо</div>
            </div>
        </div>

    </main>

    <script>
        let html5QrCode = null;
        let currentStep = 1;
        let tempShk1 = '';
        let boxes = [];
        let lastScannedCode = '';
        let lastScanTime = 0;

        window.onload = function() {
            const saved = localStorage.getItem('scanned_boxes');
            if (saved) {
                boxes = JSON.parse(saved);
                renderBoxes();
            }
        };

        // Звуковий сигнал (працює на iPhone після першого натискання кнопки)
        function playBeep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); // Нота Ля
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.12);
            } catch (e) {}
        }

        async function initAndStartScanner() {
            try {
                // Отримуємо список усіх камер (це також запитує дозвіл у Safari)
                const devices = await Html5Qrcode.getCameras();
                
                if (devices && devices.length > 0) {
                    const select = document.getElementById('camera-select');
                    select.innerHTML = '';
                    
                    let preferredCameraId = devices[0].id;

                    devices.forEach((device, index) => {
                        const option = document.createElement('option');
                        option.value = device.id;
                        const label = device.label || `Камера ${index + 1}`;
                        option.text = label;
                        select.appendChild(option);

                        // Намагаємося автоматично знайти основну задню камеру, уникаючи Ultra Wide
                        const lowerLabel = label.toLowerCase();
                        if ((lowerLabel.includes('back') || lowerLabel.includes('задн') || lowerLabel.includes('environment')) 
                            && !lowerLabel.includes('ultra')) {
                            preferredCameraId = device.id;
                        }
                    });

                    select.value = preferredCameraId;
                    document.getElementById('camera-select-wrapper').classList.remove('hidden');
                    
                    startScannerWithId(preferredCameraId);
                } else {
                    alert("Камери не знайдено. Перевірте дозволи для браузера в налаштуваннях iPhone.");
                }
            } catch (err) {
                console.error("Помилка отримання камер:", err);
                alert("Не вдалося отримати доступ до камери. Переконайтеся, що сайт відкрито через HTTPS і доступ дозволено.");
            }
        }

        function startScannerWithId(cameraId) {
            const placeholder = document.getElementById('camera-placeholder');
            placeholder.style.display = 'none';

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader", {
                    // Вмикаємо підтримку лінійних штрихкодів та нативного детектора iOS
                    formatsToSupport: [
                        Html5QrcodeSupportedFormats.CODE_128,
                        Html5QrcodeSupportedFormats.EAN_13,
                        Html5QrcodeSupportedFormats.EAN_8,
                        Html5QrcodeSupportedFormats.CODE_39,
                        Html5QrcodeSupportedFormats.UPC_A,
                        Html5QrcodeSupportedFormats.UPC_E,
                        Html5QrcodeSupportedFormats.ITF,
                        Html5QrcodeSupportedFormats.QR_CODE
                    ],
                    experimentalFeatures: {
                        useBarCodeDetectorIfSupported: true
                    }
                });
            }

            // Широка прямокутна рамка ідеальна для довгих лінійних штрихкодів на коробках
            const config = { 
                fps: 15, 
                qrbox: function(viewfinderWidth, viewfinderHeight) {
                    return {
                        width: Math.floor(viewfinderWidth * 0.85),
                        height: Math.floor(viewfinderHeight * 0.45)
                    };
                },
                videoConstraints: {
                    deviceId: { exact: cameraId },
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            };

            html5QrCode.start(
                cameraId, 
                config, 
                onScanSuccess,
                () => {}
            ).then(() => {
                document.getElementById('btn-start-camera').classList.add('hidden');
                document.getElementById('btn-stop-camera').classList.remove('hidden');
            }).catch(err => {
                console.error("Помилка запуску:", err);
                alert("Помилка запуску обраної камери. Спробуйте вибрати іншу зі списку вище.");
                placeholder.style.display = 'flex';
            });
        }

        async function switchCamera() {
            const cameraId = document.getElementById('camera-select').value;
            if (html5QrCode && html5QrCode.isScanning) {
                await html5QrCode.stop();
            }
            startScannerWithId(cameraId);
        }

        function stopScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    document.getElementById('camera-placeholder').style.display = 'flex';
                    document.getElementById('btn-start-camera').classList.remove('hidden');
                    document.getElementById('btn-stop-camera').classList.add('hidden');
                }).catch(err => console.error(err));
            }
        }

        function onScanSuccess(decodedText) {
            const now = Date.now();
            const code = decodedText.trim();
            
            // Захист від подвійного миттєвого зчитування одного й того ж коду (затримка 1.5 сек)
            if (code === lastScannedCode && (now - lastScanTime) < 1500) {
                return;
            }
            lastScannedCode = code;
            lastScanTime = now;

            playBeep();
            if (navigator.vibrate) navigator.vibrate(100);
            processScannedValue(code);
        }

        function scanFromFile(e) {
            if (e.target.files.length == 0) return;
            const imageFile = e.target.files[0];
            
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            html5QrCode.scanFile(imageFile, true)
                .then(decodedText => {
                    playBeep();
                    processScannedValue(decodedText.trim());
                })
                .catch(err => {
                    alert("Не вдалося розпізнати штрихкод на фото. Спробуйте зробити чіткіше фото або введіть вручну.");
                });
        }

        function handleManualSubmit() {
            const input = document.getElementById('manual-input');
            const val = input.value.trim();
            if (!val) return;
            processScannedValue(val);
            input.value = '';
        }

        function processScannedValue(value) {
            if (currentStep === 1) {
                tempShk1 = value;
                document.getElementById('val-shk1').innerText = tempShk1;
                currentStep = 2;
                document.getElementById('step-indicator').innerText = "Крок 2 з 2: Серійний номер";
                document.getElementById('badge-shk1').innerText = "Очікування ШК2";
                document.getElementById('badge-shk1').className = "text-xs bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full font-medium";
            } else {
                let tempShk2 = value;
                document.getElementById('val-shk2').innerText = tempShk2;

                boxes.unshift({
                    shk1: tempShk1,
                    shk2: tempShk2,
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
                });

                saveAndReset();
            }
        }

        function saveAndReset() {
            localStorage.setItem('scanned_boxes', JSON.stringify(boxes));
            renderBoxes();

            currentStep = 1;
            tempShk1 = '';
            document.getElementById('val-shk1').innerText = 'не зчитано';
            document.getElementById('val-shk2').innerText = 'очікується...';
            document.getElementById('step-indicator').innerText = "Крок 1 з 2: Назва / Модель";
            document.getElementById('badge-shk1').innerText = "Очікування ШК1";
            document.getElementById('badge-shk1').className = "text-xs bg-indigo-100 text-indigo-800 px-2.5 py-1 rounded-full font-medium";
        }

        function renderBoxes() {
            const container = document.getElementById('boxes-list');
            document.getElementById('box-count').innerText = boxes.length;

            if (boxes.length === 0) {
                container.innerHTML = `<div id="empty-state" class="text-center text-slate-400 py-8 text-sm">Поки що порожньо</div>`;
                return;
            }

            container.innerHTML = boxes.map((box, index) => `
                <div class="bg-slate-50 border border-slate-200 p-3 rounded-lg flex justify-between items-center text-sm">
                    <div>
                        <div class="text-xs text-slate-400 mb-0.5">${box.time}</div>
                        <div><b>Модель (ШК1):</b> <span class="text-indigo-600">${box.shk1}</span></div>
                        <div><b>Серійний (ШК2):</b> <span class="text-emerald-700">${box.shk2}</span></div>
                    </div>
                    <button onclick="deleteBox(${index})" class="text-slate-400 hover:text-rose-600 p-1 transition" title="Видалити">
                        ✕
                    </button>
                </div>
            `).join('');
        }

        function deleteBox(index) {
            boxes.splice(index, 1);
            localStorage.setItem('scanned_boxes', JSON.stringify(boxes));
            renderBoxes();
        }

        function clearHistory() {
            if (confirm("Видалити всі збережені коробки?")) {
                boxes = [];
                localStorage.removeItem('scanned_boxes');
                renderBoxes();
            }
        }

        function exportToCSV() {
            if (boxes.length === 0) {
                alert("Список порожній!");
                return;
            }

            let csvContent = "\uFEFFШК1 (Модель),ШК2 (Серійний номер),Час\n" + 
                boxes.map(b => `"${b.shk1}","${b.shk2}","${b.time}"`).join("\n");

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `boxes_scan_${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
